<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>3D Wave Physics Lab</title>
    <style>
        body { margin: 0; background: #050505; color: white; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
    </style>
</head>
    <script src="https://unpkg.com/lil-gui@0.17.0/dist/lil-gui.umd.js"></script>
<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.140.0/build/three.module.js';
    import { EffectComposer } from 'https://unpkg.com/three@0.140.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://unpkg.com/three@0.140.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://unpkg.com/three@0.140.0/examples/jsm/postprocessing/UnrealBloomPass.js'
<body>
    <div id="ui"><h1>Song Co Hoc 3D</h1><p>Mo phong giao thoa song</p></div>
    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.132.2';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const gui = new lil.GUI();
        gui.add(params, 'freq', 0.1, 5);
        gui.add(params, 'amp', 0, 3);
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        composer.addPass(bloomPass);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(20, 20, 50, 50);
        const material = new THREE.MeshPhongMaterial({ color: 0x00d4ff, wireframe: true });
        const plane = new THREE.Mesh(geometry, material);
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);

        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);
        
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(0, 5, 5);
        scene.add(light);

        function animate(time) {
            requestAnimationFrame(animate);
            const positions = plane.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const y = positions[i + 1];
                positions[i + 2] = Math.sin(x * 0.5 + time * 0.005) * Math.cos(y * 0.5 + time * 0.005);
            }
            plane.geometry.attributes.position.needsUpdate = true;
            composer.render();
        }
        animate(0);
    </script>
</body>
</html>
